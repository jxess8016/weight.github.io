<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>몸무게</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <h2 id="lt">암호 입력</h2>
  <p id="ld"></p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>

<main id="app" class="hide">
  <header class="rise" style="--i:0"><div class="d" id="today"></div><h1>몸무게</h1></header>

  <section class="card rise" style="--i:1">
    <div class="lbl">현재</div>
    <div class="big"><span id="cur">--</span><small>kg</small></div>
    <div class="pill" id="pill">아래 + 버튼으로 첫 기록을 남겨보세요</div>
    <div class="mini">
      <div><span>시작 대비</span><b id="sChange">-</b></div>
      <div><span>최저</span><b id="sMin">-</b></div>
      <div><span>평균</span><b id="sAvg">-</b></div>
    </div>
  </section>

  <section class="card rise" style="--i:2">
    <div class="seg" id="seg"><i></i><button data-r="7">7일</button><button data-r="30">30일</button><button data-r="0">전체</button></div>
    <div id="scrub"></div>
    <div id="chart"></div>
  </section>

  <h3 class="rise" style="--i:3">기록</h3>
  <section class="group rise" style="--i:3" id="list"></section>

  <h3 class="rise" style="--i:4">데이터</h3>
  <section class="group links rise" style="--i:4">
    <button class="row" id="exp">파일로 내보내기</button>
    <button class="row" id="imp">파일 불러오기</button>
    <button class="row" id="lockNow">지금 잠그기</button>
  </section>
  <input type="file" id="file" accept="application/json" class="hide">
</main>

<button id="fab" class="hide" aria-label="기록 추가">+</button>

<div class="sbg" id="sbg"><div id="sheet">
  <div class="grab"></div>
  <h2 id="stitle">기록 추가</h2>
  <input type="date" id="sdate" aria-label="날짜">
  <div class="step"><button id="mi" aria-label="0.1 감소">−</button><input id="skg" type="number" step="0.1" inputmode="decimal" aria-label="몸무게"><button id="pl" aria-label="0.1 증가">+</button></div>
  <div class="unit">kg</div>
  <div id="serr"></div>
  <button class="pri" id="ssave">저장</button>
  <button id="sdel" class="hide">삭제</button>
</div></div>
<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
